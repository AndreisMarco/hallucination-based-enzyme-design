[project]
name = "jsapiens"
version = "0.1.0"
description = "JAX translation of Sapiens LM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.0",
    "equinox>=0.12.1",
    "jax>=0.5.3",
    "jaxtyping>=0.3.2",
    "marimo>=0.13.9",
    "numpy>=1.26.3",
    "ruff>=0.11.10",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[tool.uv]
package = true
