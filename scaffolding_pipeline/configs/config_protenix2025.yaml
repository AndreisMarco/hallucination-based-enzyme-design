seed: 11037
dir: "testing/runs/"
model: "Protenix2025"  # Protenix2025, ProtenixBase, ProtenixMini, ProtenixTiny, Boltz2

scaffold:
  input_file: "structures/1LNS.cif"
  keep_intervals: "347-349,467-469,497-499"
  order: [0, 1, 2]
  loops: [30, 20, 30, 30]

loss:
  loss_terms:
    # Structure losses
    PLDDTLoss: 1.0
    WithinBinderPAE: 1.0
    WithinBinderContact: 1.0
    BinderPTMLoss: 1.0
    DistogramRadiusOfGyration: 1.0
    HelixLoss: 1.0
    # Scaffolding losses
    DistogramCCE: 1.0
    FAPE: 1.0
    RMSD: 1.0
  recycling_steps: 1
  num_samples: 4
  sampling_steps: 10
  features_to_log:
  # features_to_log:
  #   - "feature1"
  #   - "feature2"

optimizer:
  run_explore:
    type: "SimplexAPGM"  # SimplexAPGM, LogitAPGM
    n_steps: 10
    step_size: 0.15  # gets scaled by sqrt(scaffold_len)
    momentum: 0.3
    scale: 1.0
    max_gradient_norm: 1.0
    sample_loss: false
    serial_evaluation: false
    update_loss_state: false
    log_trajectory: true
    use_wandb: false

  run_sharpen:
    type: "SimplexAPGM"
    n_steps: 2
    step_size: 0.5  # gets scaled by sqrt(scaffold_len) 
    momentum: 0.0
    scale: 1.3
    max_gradient_norm: 1.0
    sample_loss: false
    serial_evaluation: false
    update_loss_state: false
    log_trajectory: true
    use_wandb: false
  
logging:
  save_loss_plot: true
  save_pssm_video: true
  save_pdb: true